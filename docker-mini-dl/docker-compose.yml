version: "3.9"

services:

  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped

    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

    command: server /data --console-address ":9001"

    volumes:
      - minio-data:/data

  postgres:
    image: postgres:16

    container_name: postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: dw
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

  adminer:
    image: adminer

    container_name: adminer

    restart: unless-stopped

    ports:
      - "8080:8080"

    depends_on:
      - postgres

  jupyter:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: jupyter
    restart: unless-stopped

    ports:
      - "8888:8888"

    environment:
      JUPYTER_TOKEN: profesor

    volumes:
      - ./notebooks:/home/jovyan/work/notebooks
      - ./src:/home/jovyan/work/src
      - ./datasets:/home/jovyan/work/datasets

    working_dir: /home/jovyan/work
    depends_on:
      - postgres
      - minio
  
  createbuckets:
    image: minio/mc
    container_name: minio-init

    depends_on:
      - minio

    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do
        echo 'Esperando a MinIO...';
        sleep 2;
      done;

      mc mb local/raw --ignore-existing;
      mc mb local/bronze --ignore-existing;
      mc mb local/silver --ignore-existing;
      mc mb local/gold --ignore-existing;

      echo 'Buckets creados';
      "
volumes:
  minio-data:
  postgres-data: