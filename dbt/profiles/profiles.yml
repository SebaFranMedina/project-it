playground:
  target: dev
  outputs:
    dev:
      type: postgres
      host: db              # ← nombre del servicio en tu docker-compose, no "localhost"
      port: 5432
      user: "{{ env_var('POSTGRES_USER') }}"
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      dbname: "{{ env_var('POSTGRES_DB') }}"
      schema: public