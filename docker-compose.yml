services:
  db:
    container_name: postgres_container
    image: postgres:14.17
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    healthcheck:                                          # nuevo: para que "src" espere a que Postgres esté LISTO
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  src:                                                      # servicio nuevo: tu script de extracción
    build: ./src
    container_name: src_container
    environment:
      POSTGRES_HOST: db                                     # nombre del servicio de arriba, no "localhost"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      API_KEY: ${API_FOOTBALL_KEY}
      LEAGUE_ID: 1
      SEASON: 2022
    depends_on:
      db:
        condition: service_healthy

  dbt:                                                    # servicio nuevo
    image: ghcr.io/dbt-labs/dbt-postgres:1.8.latest
    platform: linux/amd64 
    container_name: dbt_container
    working_dir: /usr/app
    environment:
      DBT_PROFILES_DIR: /root/.dbt
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./dbt:/usr/app
      - ./dbt/profiles:/root/.dbt
    depends_on:
      db:
        condition: service_healthy